# ImotSync — production stack for one server (docs/deploy.md):
#   web     Caddy: HTTPS, the admin panel's static files, reverse proxy to the API
#   api     REST API (applies pending migrations at each start)
#   worker  publishing jobs and housekeeping
#   db      MariaDB 11.8
# From this folder, with deploy/.env filled in (copy .env.example):
#   docker compose up -d --build --wait
#   bash demo-reset.sh       load (or reset to) the made-up demo data
# Only Caddy publishes ports. The API and the database are reachable inside this stack only.

name: imotsync-prod

# Docker's default log driver keeps everything; cap each container's logs at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Settings that both the API and the worker read (the same image and configuration code). The
# secrets are not here: each service adds only the ones it uses.
x-app-environment: &app-environment
  NODE_ENV: production
  # The public demo: shared demo login, lower limits, closed feeds (README, Public demo).
  DEMO_MODE: ${DEMO_MODE:-true}
  UPLOAD_DIR: /app/uploads
  # sharp's fontconfig cache (text on the generated demo photos); the root file system is read-only.
  XDG_CACHE_HOME: /tmp/.cache
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-imotsync}
  DB_USER: ${DB_USER:-imotsync}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
  # Only true for a local run of this stack over plain HTTP; never on the server.
  ALLOW_INSECURE_PUBLIC_BASE_URL: ${ALLOW_INSECURE_PUBLIC_BASE_URL:-false}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  DEMO_PORTAL_FAILURE_RATE: ${DEMO_PORTAL_FAILURE_RATE:-0.3}
  DEMO_PORTAL_LATENCY_MS: ${DEMO_PORTAL_LATENCY_MS:-400}
  # Shorter retry delays than the default (30 s doubling): a visitor sees a failed demo-portal
  # attempt retried within a minute or two.
  RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-10}
  RETRY_CAP_SECONDS: ${RETRY_CAP_SECONDS:-120}

# The API and the worker need no privileges: unprivileged user (the image's), read-only root
# file system, writable uploads volume and /tmp only.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_NAME:-imotsync}
      MARIADB_USER: ${DB_USER:-imotsync}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The demo's data is a few megabytes; leave the 4 GB server's memory to the rest.
      - --innodb-buffer-pool-size=256M
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ../api
    image: imotsync-api:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    <<: *app-hardening
    command: ['sh', '-c', 'node dist/db/migrate.js latest && exec node dist/server.js']
    environment:
      <<: *app-environment
      API_PORT: 3000
      # The admin panel is served from the same origin (PUBLIC_BASE_URL).
      CORS_ORIGIN: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
      # Caddy is the only client, from this stack's private network: the API takes each visitor's
      # address from the X-Forwarded-For header that Caddy sets, for its rate limits. That holds
      # for IPv4 visitors; this network has no IPv6, so publish no AAAA record (docs/deploy.md,
      # step 6), or IPv6 visitors would all reach Caddy from Docker's gateway address.
      TRUST_PROXY: uniquelocal
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      FEED_TOKEN: ${FEED_TOKEN:?set FEED_TOKEN in deploy/.env}
      # The nightly reset (demo-reset.sh) runs the seed in a one-off api container; production
      # refuses the seed unless this is true, which is the case on the demo only.
      ALLOW_DEMO_SEED: ${DEMO_MODE:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?set SEED_DEMO_PASSWORD in deploy/.env}
    volumes:
      - uploads:/app/uploads

  worker:
    build:
      context: ../api
    image: imotsync-api:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    <<: *app-hardening
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-environment
      # The Realistimo import sync stays off: the API refuses a key when DEMO_MODE=true.
      REALISTIMO_API_KEY: ''
    volumes:
      - uploads:/app/uploads
    # The image's health check calls the API; the worker serves no HTTP.
    healthcheck:
      disable: true
    # On stop the worker finishes the jobs in flight (up to JOB_TIMEOUT_SECONDS, 60 by default).
    stop_grace_period: 90s

  web:
    build:
      context: ../web
    image: imotsync-web:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      # imotsync.palovtech.com on the server; :80 for a local run over plain HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      # The largest request body Caddy passes on (and buffers), in bytes; 30 MB fits the demo.
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-31457280}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys: keep them, or Let's Encrypt's rate limits may bite.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
